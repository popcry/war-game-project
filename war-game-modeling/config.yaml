    SELF_DEST_DRONE: 5
    COMMAND_POST: 1

# --- 자금 추적 (Money, Merge_trench_dest) ---
# fire_cost: 사격한 팀에 부과 / damage: 피해 입은 유닛 소유 팀에 부과
money:
  fire_cost:
    RIFLE: 10
    ANTI_TANK: 200
    TANK: 300
    ARTILLERY: 500
    DRONE: 0
    SELF_DEST_DRONE: 1000
    COMMAND_POST: 0
  unit_value:
    RIFLE: 100
    ANTI_TANK: 800
    TANK: 5000
    ARTILLERY: 3000
    DRONE: 1500
    SELF_DEST_DRONE: 2000
    COMMAND_POST: 10000
  damage_ratio:
    ALIVE: 0.0
    MINOR: 0.1
    SERIOUS: 0.5
    CRITICAL: 0.8
    FATAL: 1.0
    M_KILL: 0.4
    F_KILL: 0.4
    MF_KILL: 0.7
    K_KILL: 1.0

# ============================================================
# Terrain layer settings
# Layer priority: river -> trench -> road -> mountain -> normal
#
# 확장 부흘레다르 bbox로 새로 라벨링 예정.
# 지금은 elevation_file만 새 DEM (database/xyz_coordinates.csv) 로 설정하고,
# river/road/trench 마스크 파일은 비어있어 자동으로 빈 마스크로 처리됨.
# 사용자가 새 마스크 CSV(1200×875)를 만들어 채우면 그대로 동작합니다.
# ============================================================
terrain:
  source: "vuhledar_5x"
  # 5x 확장 영역(1200×875, 25 m/px) — vuhledar_bbox_5x/terrain_grid_30m.csv 에서 변환·리샘플됨
  # (생성 스크립트: scripts/build_vuhledar_5x_layers.py + scripts/resize_layers_to_1200x875.py)
  elevation_file: "database/vuhledar_5x_elevation.csv"
  river_mask_file: "database/vuhledar_5x_river_mask.disabled.csv"  # 임시 비활성: 강 위 유닛 갇힘 + LOS 차단 회피
  road_type_file:  "database/vuhledar_5x_road_type.csv"
  trench_mask_file: "database/vuhledar_5x_trench_mask.csv"
  trench_labels: [1, "1", "trench", "true", "t"]
  mountain_elevation_quantile: 0.75
  mobility:
    normal: 1.0
    mountain: 0.8
    river: 0.2
    road: 1.15
    trench: 0.7
  visibility:
    normal: 1.0
    mountain: 0.8
    river: 1.0
    road: 1.0
    trench: 0.5
  hit_probability:
    normal: 1.0
    mountain: 0.9
    river: 1.0
    road: 1.0
    trench: 0.6
  damage_probability:
    normal: 1.0
    mountain: 0.9
    river: 1.0
    road: 1.0
    trench: 0.6
