# ============================================================
# War-game simulation config
# Merge_trench_dest(참호·자폭드론 + layered terrain) + dh 인프라(CSV/headless/조기종료/config화)
# 모든 하이퍼파라미터를 이 파일에서 관리합니다.
# ============================================================

max_time: 3600

# --- 비디오 / CSV 출력 ---
video:
  enabled: true
  output_path: "results/simulation.mp4"
  fps: 10

csv:
  enabled: true
  output_path: "results/simulation.csv"
  money_output_path: "results/money.csv"   # 매 tick 팀별 누적 자금(사격·피해·합계) 기록

distance_rescale: 1

# --- 시뮬레이션 코어 ---
# 확장 부흘레다르 bbox 기준:
#   south=47.6664170, west=37.0680910, north=47.8612220, east=37.4654310
#   ≈ 29.75 km(가로) × 21.69 km(세로), 비율 1.37
#   캔버스 1200×875 × 25 m/px → 정확히 매핑
simulation:
  pixel_to_meter_scale: 25.0   # 1 pixel = 25 meters  (5 → 25, 스케일 5배 증가)
  map_width_px: 1200
  map_height_px: 875
  lethal_radius: 30.0          # 포병 치사반경 (m)
  mountain_detect_prob: 0.2    # 산악 지형 탐지 확률
  drone_elevation: 200.0       # 드론 비행 고도 (m)
  combat_unit_types: [RIFLE, ANTI_TANK, TANK, ARTILLERY]
  # 새 bbox (참고용, 코드에서 직접 안 씀)
  bbox:
    south: 47.6664170
    west:  37.0680910
    north: 47.8612220
    east:  37.4654310

# --- 스케일 보정 상수 (원본 코드 호환) ---
scaling:
  range_extra_div_non_artillery: 5   # 포병 외 detect/weapon range 추가 제수
  speed_scale_divisor: 5             # km/h → px/s 변환 제수
  speed_time_multiplier: 30          # km/h → px/s 변환 시간 계수

# --- 탐지 / LOS ---
detection:
  los_check_interval_px: 10   # 두 유닛 사이 LOS 샘플 간격 (픽셀)

# --- 사격 ---
fire:
  artillery_sigma_range_pct: 0.02   # 포병 사거리 공산오차
  artillery_sigma_dev_pct: 0.01     # 포병 편의 공산오차
  self_dest_drone_lethal_radius_m: 5.0
  protected_terrain_types: [mountain, trench]   # 방호(차폐) 상태로 판정하는 지형
  # Attacker -> target priority. Only listed target types are selected.
  # If multiple targets have the same priority type, the nearest one is selected.
  target_priority:
    RIFLE: [RIFLE, DRONE, ANTI_TANK]
    ARTILLERY: [TANK, RIFLE]
    TANK: [TANK, ANTI_TANK, RIFLE]
    ANTI_TANK: [TANK]
    DRONE: [TANK, RIFLE]
    SELF_DEST_DRONE: [TANK, RIFLE]

# --- 명중/살상 확률 테이블 (구 database/*.csv) ---
# 각 표는 columns + rows 로 정의되며, 코드에서 동일한 DataFrame으로 로드됩니다.
# hit  : 거리 × 방호상태(ES/EM/DS/DM) → 명중확률
# kh   : 피격 시 상태별 확률
probabilities:
