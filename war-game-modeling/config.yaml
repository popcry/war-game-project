num_artillery_red: 6
num_artillery_blue: 6
num_drone_red: 1
num_drone_blue: 1
num_tank_red: 4
num_tank_blue: 4
num_at_red: 6
num_at_blue: 6
num_infantry_red: 24
num_infantry_blue: 24
num_cp_red: 1
num_cp_blue: 1
num_self_dest_drone_red: 1
num_self_dest_drone_blue: 1

# --- 자금 추적 (Money, Merge_trench_dest) ---
# fire_cost: 사격한 팀에 부과 / damage: 피해 입은 유닛 소유 팀에 부과
money:
  fire_cost:
    RIFLE: 10
    ANTI_TANK: 200
    TANK: 300
    ARTILLERY: 500
    DRONE: 0
    SELF_DEST_DRONE: 1000
    COMMAND_POST: 0
  unit_value:
    RIFLE: 100
    ANTI_TANK: 800
    TANK: 5000
    ARTILLERY: 3000
    DRONE: 1500
    SELF_DEST_DRONE: 2000
    COMMAND_POST: 10000
  damage_ratio:
    ALIVE: 0.0
    MINOR: 0.1
    SERIOUS: 0.5
    CRITICAL: 0.8
    FATAL: 1.0
    M_KILL: 0.4
    F_KILL: 0.4
    MF_KILL: 0.7
    K_KILL: 1.0

# ============================================================
# Terrain layer settings (Merge_trench_dest)
# Layer priority: river -> trench -> road -> mountain -> normal
# ============================================================
terrain:
  source: "vuhledar_layers"
  elevation_file: "database/vuhledar_elevation.csv"
  river_mask_file: "database/vuhledar_river_mask.csv"
  road_type_file: "database/vuhledar_road_type.csv"
  trench_mask_file: "database/vuhledar_trench_mask.csv"
  trench_labels: [1, "1", "trench", "true", "t"]
  mountain_elevation_quantile: 0.75
  mobility:
    normal: 1.0
    mountain: 0.8
    river: 0.2
    road: 1.15
    trench: 0.7
  visibility:
    normal: 1.0
    mountain: 0.8
    river: 1.0
    road: 1.0
    trench: 0.5
  hit_probability:
    normal: 1.0
    mountain: 0.9
    river: 1.0
    road: 1.0
    trench: 0.6
  damage_probability:
    normal: 1.0
    mountain: 0.9
    river: 1.0
    road: 1.0
    trench: 0.6
