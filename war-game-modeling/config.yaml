# ============================================================
# War-game simulation config
# 모든 하이퍼파라미터는 이 파일에서 관리합니다.
# 코드 수정 없이 이 파일만 바꿔서 실험 가능.
# ============================================================

# --- 시뮬레이션 시간 ---
max_time: 300         # 시뮬레이션 상한 (초)

# --- 비디오 / CSV 출력 ---
video:
  enabled: true
  output_path: "results/simulation.mp4"
  fps: 10

csv:
  enabled: true
  output_path: "results/simulation.csv"

distance_rescale: 1

# --- 시뮬레이션 코어 ---
simulation:
  pixel_to_meter_scale: 5.0   # 1 픽셀 = 5m
  map_width_px: 800           # 시각화/Pathfinder가 쓰는 맵 폭(px)
  map_height_px: 450
  lethal_radius_m: 30.0       # 포병 치사반경 (m)
  mountain_detect_prob: 0.2   # 산악 지형에서의 탐지 성공 확률
  drone_elevation_m: 200.0    # 드론 비행 고도 (m)

# --- 지형 ---
terrain:
  dem_file: "database/xyz_coordinates.csv"
  mountain_threshold_m: 50    # 이 고도 이상이면 'mountain'
  river_threshold_m: 39       # 이 고도 이하면 'river'
  decay_rates:
    mountain: 0.8             # 산악 이동속도 감쇠
    river: 0.8
    normal: 1.0

# --- 탐지 / LOS ---
detection:
  los_check_interval_px: 10   # 두 유닛 사이 LOS 샘플 간격 (픽셀)

# --- 사격 ---
fire:
  artillery_sigma_range_pct: 0.02   # 포병 사거리 공산오차 (탄착점 σ_y = 이 값 × 사거리)
  artillery_sigma_dev_pct: 0.01     # 포병 편의 공산오차 (σ_x)

# --- 이동 ---
movement:
  min_distance_to_objective_m: 50   # 목표 지점 도달 판정 거리
  objective_jitter_px: 100          # 팀 maneuver_objective에 더하는 ±랜덤 분산

# --- 드론 정찰 ---
drone:
  grid_cell_size_m: 250             # 3×3 격자 한 칸 크기 (m) — 원본값
  pattern_change_time_s: 60.0       # 다음 격자로 옮기는 주기 (초)

# --- 유닛별 능력치 ---
# fire_interval:
#   [a, b]      → random.uniform(a, b)
#   [a, b, c]   → random.triangular(a, b, c)   (low, high, mode)
#   null        → 사격 안 함
units:
  RIFLE:
    detect_range_m: 1000
    detectability: 0.8
    weapon_range_m: 400
    speed_kmh: 7
    fire_interval: [2.0, 3.0]
  ANTI_TANK:
    detect_range_m: 3000
    detectability: 0.8
    weapon_range_m: 3000
    speed_kmh: 5
    fire_interval: [60.0, 180.0, 100.0]
  TANK:
    detect_range_m: 3000
    detectability: 2.0
    weapon_range_m: 3000
    speed_kmh: 13
    fire_interval: [5.0, 10.0, 6.0]
  ARTILLERY:
    detect_range_m: 1000
    detectability: 2.0
    weapon_range_m: 11300
    speed_kmh: 0
    fire_interval: [6.0, 20.0, 10.0]
  DRONE:
    detect_range_m: 500
    detectability: 0
    weapon_range_m: 0
    speed_kmh: 25
    fire_interval: null
  COMMAND_POST:
    detect_range_m: 1000
    detectability: 1.0
    weapon_range_m: 400
    speed_kmh: 5
    fire_interval: [2.0, 3.0]

# --- 작전단계 (Phase) ---
# 각 팀의 단계별 TAI / 사격우선순위 / 기동목표
# fire_priority 숫자가 낮을수록 포병 표적 우선순위 높음
phases:
  RED:
    phase_1:
      TAI: [400, 200]
      fire_priority:
        RIFLE: 5
        ANTI_TANK: 4
        TANK: 3
        ARTILLERY: 1
        COMMAND_POST: 2
      maneuver_objective: null
    phase_2:
      TAI: [500, 150]
      fire_priority:
        RIFLE: 5
        ANTI_TANK: 4
        TANK: 1
        ARTILLERY: 3
        COMMAND_POST: 2
      maneuver_objective: null
    phase_3:
      TAI: [500, 150]
      fire_priority:
        RIFLE: 4
        ANTI_TANK: 2
        TANK: 1
        ARTILLERY: 5
        COMMAND_POST: 3
      maneuver_objective: null
  BLUE:
    phase_1:
      TAI: [300, 320]
      fire_priority:
        RIFLE: 5
        ANTI_TANK: 4
        TANK: 3
        ARTILLERY: 1
        COMMAND_POST: 2
      maneuver_objective: null
    phase_2:
      TAI: [300, 250]
      fire_priority:
        RIFLE: 5
        ANTI_TANK: 4
        TANK: 1
        ARTILLERY: 3
        COMMAND_POST: 2
      maneuver_objective: null
    phase_3:
      TAI: [350, 300]
      fire_priority:
        RIFLE: 4
        ANTI_TANK: 2
        TANK: 1
        ARTILLERY: 5
        COMMAND_POST: 3
      maneuver_objective: [[350, 300]]

# Phase 전환 조건 (지휘소가 평가)
phase_transitions:
  friendly_artillery_lost_to_close_combat: 4   # 아군 포병 N대 이상 손실 → CLOSE_COMBAT
  enemy_artillery_destroyed_to_phase_2: 4      # 적 포병 N대 이상 격파 → phase_2
  enemy_tanks_destroyed_to_close_combat: 2     # 적 전차 N대 이상 격파 → CLOSE_COMBAT

