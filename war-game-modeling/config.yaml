# --- 자금 추적 (Money, Merge_trench_dest) ---
# fire_cost: 사격한 팀에 부과 / damage: 피해 입은 유닛 소유 팀에 부과
money:
  fire_cost:
    RIFLE: 10
    ANTI_TANK: 200
    TANK: 300
    ARTILLERY: 500
    DRONE: 0
    SELF_DEST_DRONE: 1000
    COMMAND_POST: 0
  unit_value:
    RIFLE: 100
    ANTI_TANK: 800
    TANK: 5000
    ARTILLERY: 3000
    DRONE: 1500
    SELF_DEST_DRONE: 2000
    COMMAND_POST: 10000
  damage_ratio:
    ALIVE: 0.0
    MINOR: 0.1
    SERIOUS: 0.5
    CRITICAL: 0.8
    FATAL: 1.0
    M_KILL: 0.4
    F_KILL: 0.4
    MF_KILL: 0.7
