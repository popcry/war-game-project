# ============================================================
# Terrain layer settings
# Layer priority: river -> trench -> road -> mountain -> normal
#
# 확장 부흘레다르 bbox로 새로 라벨링 예정.
# 지금은 elevation_file만 새 DEM (database/xyz_coordinates.csv) 로 설정하고,
# river/road/trench 마스크 파일은 비어있어 자동으로 빈 마스크로 처리됨.
# 사용자가 새 마스크 CSV(1200×875)를 만들어 채우면 그대로 동작합니다.
# ============================================================
terrain:
  source: "vuhledar_expanded"
  # 확장 bbox용 지형 레이어 — 새 지도 데이터(이미 라벨링된)를 아래 경로로 떨어뜨리면 자동 인식.
  # 파일이 없으면 해당 마스크는 모두-False(없음)로 안전 처리됨.
  elevation_file: "database/xyz_coordinates.csv"
  river_mask_file: "database/vuhledar_ext_river_mask.csv"
  road_type_file:  "database/vuhledar_ext_road_type.csv"
  trench_mask_file: "database/vuhledar_ext_trench_mask.csv"
  trench_labels: [1, "1", "trench", "true", "t"]
  mountain_elevation_quantile: 0.75
  mobility:
    normal: 1.0
    mountain: 0.8
    river: 0.2
    road: 1.15
    trench: 0.7
  visibility:
    normal: 1.0
    mountain: 0.8
    river: 1.0
    road: 1.0
    trench: 0.5
  hit_probability:
    normal: 1.0
    mountain: 0.9
    river: 1.0
    road: 1.0
    trench: 0.6
  damage_probability:
    normal: 1.0
    mountain: 0.9
    river: 1.0
    road: 1.0
    trench: 0.6
