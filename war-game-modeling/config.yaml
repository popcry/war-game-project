# --- 이동 ---
movement:
  min_distance_to_objective_m: 50   # 목표 지점 도달 판정 거리
  objective_jitter_px: 20           # maneuver_objective ±랜덤 분산 (≈500m, 5x 스케일 보정)

# --- 드론 정찰 ---
drone:
  grid_cell_size_m: 250             # 3×3 격자 한 칸 크기 (m)
  pattern_change_time_s: 60.0       # 다음 격자로 옮기는 주기 (초)
  # TAI 중심 3×3 격자 순회 순서 (grid_x, grid_y; 1~3)
  pattern: [[1,1],[1,2],[1,3],[2,3],[2,2],[2,1],[3,1],[3,2],[3,3]]

# --- 유닛별 능력치 ---
# fire_interval: [a,b]→uniform(a,b),  [a,b,c]→triangular(low,high,mode),  null→사격 안 함
units:
  RIFLE:
    detect_range_m: 1000
    detectability: 0.8
    speed_kmh: 7
    weapon_range_m: 400
    fire_interval: [2.0, 3.0]
  ANTI_TANK:
    detect_range_m: 3000
    detectability: 0.8
    weapon_range_m: 3000
    speed_kmh: 5
    fire_interval: [60.0, 180.0, 100.0]
  TANK:
    detect_range_m: 3000
    detectability: 2.0
    weapon_range_m: 3000
    speed_kmh: 13
    fire_interval: [5.0, 10.0, 6.0]
  ARTILLERY:
    detect_range_m: 1000
    detectability: 2.0
    weapon_range_m: 11300
    speed_kmh: 0
    fire_interval: [6.0, 20.0, 10.0]
  DRONE:
    detect_range_m: 2000
    detectability: 0
    weapon_range_m: 0
    speed_kmh: 25
    fire_interval: null
  SELF_DEST_DRONE:
    detect_range_m: 2000
    detectability: 0
    weapon_range_m: 400
    speed_kmh: 25
    fire_interval: [0.5, 1.0]
  COMMAND_POST:
    detect_range_m: 1000
    detectability: 1.0
    weapon_range_m: 400
    speed_kmh: 5
    fire_interval: [2.0, 3.0]

# --- 작전단계 (Phase) ---
# fire_priority 숫자가 낮을수록 포병 표적 우선순위 높음
unit_overrides:
  RED:
    ARTILLERY:
      weapon_range_m: 65000
    ANTI_TANK:
      weapon_range_m: 200
    SELF_DEST_DRONE:
      weapon_range_m: 40000
  BLUE:
    ARTILLERY:
      weapon_range_m: 22000
    ANTI_TANK:
      weapon_range_m: 2500
    SELF_DEST_DRONE:
      weapon_range_m: 5000

phases:
  RED:
    phase_1:
      TAI: [600, 250]    # 5x map: BLUE 진영(북) 상공 정찰
      fire_priority: {RIFLE: 5, ANTI_TANK: 4, TANK: 3, ARTILLERY: 1, COMMAND_POST: 2}
      maneuver_objective: [[600, 350]]   # Phase 1부터 북진 (전선 형성 위해)
    phase_2:
      TAI: [600, 150]    # 더 북쪽으로 정찰 깊이 확대
      fire_priority: {RIFLE: 5, ANTI_TANK: 4, TANK: 1, ARTILLERY: 3, COMMAND_POST: 2}
      maneuver_objective: null
    phase_3:
      TAI: [600, 100]
      fire_priority: {RIFLE: 4, ANTI_TANK: 2, TANK: 1, ARTILLERY: 5, COMMAND_POST: 3}
      maneuver_objective: [[600, 80]]    # BLUE 지휘소(북단)로 진격
  BLUE:
    phase_1:
      TAI: [600, 650]    # 5x map: RED 진영(남) 상공 정찰
      fire_priority: {RIFLE: 5, ANTI_TANK: 4, TANK: 3, ARTILLERY: 1, COMMAND_POST: 2}
      maneuver_objective: [[600, 500]]   # Phase 1부터 남진 (전선 형성 위해)
    phase_2:
      TAI: [600, 750]    # 더 남쪽으로
      fire_priority: {RIFLE: 5, ANTI_TANK: 4, TANK: 1, ARTILLERY: 3, COMMAND_POST: 2}
      maneuver_objective: null
    phase_3:
      TAI: [600, 800]
      fire_priority: {RIFLE: 4, ANTI_TANK: 2, TANK: 1, ARTILLERY: 5, COMMAND_POST: 3}
      maneuver_objective: [[600, 820]]   # RED 지휘소(남단)로 진격

# Phase 전환 조건
phase_transitions:
  friendly_artillery_lost_to_close_combat: 4
  enemy_artillery_destroyed_to_phase_2: 4
  enemy_tanks_destroyed_to_close_combat: 2

