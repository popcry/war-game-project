# --- 이동 ---
movement:
  min_distance_to_objective_m: 50   # 목표 지점 도달 판정 거리
  objective_jitter_px: 100          # maneuver_objective ±랜덤 분산

# --- 드론 정찰 ---
drone:
  grid_cell_size_m: 250             # 3×3 격자 한 칸 크기 (m)
  pattern_change_time_s: 60.0       # 다음 격자로 옮기는 주기 (초)
  # TAI 중심 3×3 격자 순회 순서 (grid_x, grid_y; 1~3)
  pattern: [[1,1],[1,2],[1,3],[2,3],[2,2],[2,1],[3,1],[3,2],[3,3]]

# --- 유닛별 능력치 ---
# fire_interval: [a,b]→uniform(a,b),  [a,b,c]→triangular(low,high,mode),  null→사격 안 함
units:
  RIFLE:
    detect_range_m: 1000
    detectability: 0.8
    speed_kmh: 7
    weapon_range_m: 400
    fire_interval: [2.0, 3.0]
  ANTI_TANK:
    detect_range_m: 3000
    detectability: 0.8
    weapon_range_m: 3000
    speed_kmh: 5
    fire_interval: [60.0, 180.0, 100.0]
  TANK:
    detect_range_m: 3000
    detectability: 2.0
    weapon_range_m: 3000
    speed_kmh: 13
    fire_interval: [5.0, 10.0, 6.0]
  ARTILLERY:
    detect_range_m: 1000
    detectability: 2.0
    weapon_range_m: 11300
    speed_kmh: 0
    fire_interval: [6.0, 20.0, 10.0]
  DRONE:
    detect_range_m: 2000
    detectability: 0
    weapon_range_m: 0
    speed_kmh: 25
    fire_interval: null
  SELF_DEST_DRONE:
    detect_range_m: 2000
    detectability: 0
    weapon_range_m: 400
    speed_kmh: 25
    fire_interval: [0.5, 1.0]
  COMMAND_POST:
    detect_range_m: 1000
    detectability: 1.0
    weapon_range_m: 400
    speed_kmh: 5
    fire_interval: [2.0, 3.0]

# --- 작전단계 (Phase) ---
# fire_priority 숫자가 낮을수록 포병 표적 우선순위 높음
unit_overrides:
  RED:
    ARTILLERY:
      weapon_range_m: 65000
    ANTI_TANK:
      weapon_range_m: 200
    SELF_DEST_DRONE:
      weapon_range_m: 40000
  BLUE:
    ARTILLERY:
      weapon_range_m: 22000
    ANTI_TANK:
      weapon_range_m: 2500
    SELF_DEST_DRONE:
      weapon_range_m: 5000

phases:
